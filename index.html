 <!DOCTYPE html>
<html lang="hi">
<head>
 <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">

<!-- Zoom disable -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>राधा नाम जप काउंटर</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(180deg, #fff1c1, #f7b733);
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #222;
}

/* Top bar */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
}

.menu {
  font-size: 22px;
  cursor: pointer;
}

/* Menu */
.menu-box {
  display: none;
  position: absolute;
  right: 10px;
  top: 60px;
  background: white;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.menu-box button {
  border: none;
  background: red;
  color: white;
  padding: 10px;
  border-radius: 8px;
}

/* Center */
.center {
  text-align: center;
}

.name {
  font-size: 70px;
  font-weight: bold;
}

.circle {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 8px solid rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 20px auto;
  font-size: 50px;
  font-weight: bold;
  background: rgba(255,255,255,0.2);
}

/* Bottom */
.bottom {
  text-align: center;
  margin-bottom: 25px;
  font-size: 20px;
}
</style>
</head>

<body id="body">

<div class="top">
  <div>नाम जप Counter</div>
  <div class="menu" onclick="toggleMenu(event)">⋮</div>
</div>

<div id="menuBox" class="menu-box">
  <button onclick="resetAll()">Reset All</button>
</div>

<div class="center">
  <div class="name">राधा</div>
  <div id="circle" class="circle">0</div>
</div>

<div class="bottom" id="mala">
  Today's Mala Count: 0
</div>

<script>
let count = localStorage.getItem("count")
  ? parseInt(localStorage.getItem("count"))
  : 0;

update();

/* Full screen tap */
document.body.addEventListener("click", function (e) {
  // menu पर click ignore
  if (e.target.closest(".menu") || e.target.closest(".menu-box")) return;

  count++;
  localStorage.setItem("count", count);
  update();
});

function update() {
  document.getElementById("circle").innerText = count;

  let mala = Math.floor(count / 108);
  document.getElementById("mala").innerText =
    "Today's Mala Count: " + mala;
}

/* Menu toggle */
function toggleMenu(e) {
  e.stopPropagation();
  let menu = document.getElementById("menuBox");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

/* Reset */
function resetAll() {
  count = 0;
  localStorage.setItem("count", count);
  update();
}

/* click outside menu = close */
document.addEventListener("click", function () {
  document.getElementById("menuBox").style.display = "none";
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
</body>
</html>
